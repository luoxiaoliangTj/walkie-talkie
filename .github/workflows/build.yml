name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.log
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WalkieTalkie-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create Release with APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/*/}
          NAME="WalkieTalkie-${TAG}.apk"
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" "$NAME"
            ls -la "$NAME"
          else
            echo "No APK found"
            ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Dir not found"
            exit 1
          fi
          # Create release if not exists, then upload
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release exists, uploading..."
            gh release upload "$TAG" "$NAME" --clobber
          else
            echo "Creating release..."
            gh release create "$TAG" "$NAME" --generate-notes
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.log

      - name: Dump errors on failure
        if: failure()
        run: |
          echo "=== BUILD ERRORS ==="
          grep -E "^e: |error: |FAILURE|BUILD FAILED|Exception|Caused by" build_output.log | head -50
          echo "=== END ERRORS ==="

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.log
          retention-days: 7

      - name: Rename APK
        run: |
          ls -la app/build/outputs/apk/debug/
          TAG=${GITHUB_REF#refs/*/}
          if [[ "$TAG" == v* ]]; then
            NAME="WalkieTalkie-${TAG}"
          else
            NAME="WalkieTalkie-latest"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/${NAME}.apk
          echo "Built: ${NAME}.apk"
          ls -la app/build/outputs/apk/debug/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WalkieTalkie-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/WalkieTalkie-*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
